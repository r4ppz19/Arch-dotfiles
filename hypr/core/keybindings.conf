$mainMod = SUPER

bind = $mainMod, E, exec, $filemanager
bind = $mainMod, D, exec, $launcher
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, L, exec, $lockscreen
bind = $mainMod, F, fullscreen
bind = $mainMod, N, exec, $notifpanel
bind = $mainMod, S, exec, $websearch
bind = $mainMod, Print, exec, $screenshot
bind = $mainMod SHIFT, Print, exec, $ocr
bind = $mainMod SHIFT, R, exec, $record
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT CTRL, Q, forcekillactive
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod SHIFT, Z, exec, $zen
bind = ,XF86PowerOff, exec, $powermenu
bind = $mainMod, F5, exec, $eyetemp
bind = $mainMod, F12, exec, $colorpicker

# Zoom out/in
bind = $mainMod SHIFT, mouse_up, exec, $zoom out
bind = $mainMod SHIFT, mouse_down, exec, $zoom in

# Change focus on windows
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT, TAB, bringactivetotop
bind = ALT SHIFT, TAB, bringactivetotop

# To go to previous workspace
bind = $mainMod, TAB, workspace, previous

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move windows (floating)
bind = $mainMod CTRL, left, moveactive, -40 0
bind = $mainMod CTRL, right, moveactive, 40 0
bind = $mainMod CTRL, up, moveactive, 0 -40
bind = $mainMod CTRL, down, moveactive, 0 40

# Special workspace (scratchpad)
workspace = special:window, gapsin:3, gapsout:120 240 120 240
bind = $mainMod, W, togglespecialworkspace, window
bind = $mainMod SHIFT, W, movetoworkspace, special:window

# minimize (kinda)
workspace = special:minimize, gapsin:2, gapsout:5, border:false
bind = $mainMod, X, movetoworkspacesilent, special:minimize
bind = $mainMod, grave, togglespecialworkspace, minimize

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod ALT, left, workspace, e-1

# To prevent accidental dragging
binds {
  drag_threshold = 5
}

# Move and resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, F1, workspace, 11
bind = $mainMod, F2, workspace, 12
bind = $mainMod, F3, workspace, 13

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, F1, movetoworkspace, 11
bind = $mainMod SHIFT, F2, movetoworkspace, 12
bind = $mainMod SHIFT, F3, movetoworkspace, 13

# Laptop multimedia keys for volume, mute, brightness (script required)
bindel = ,XF86AudioRaiseVolume, exec, $mediactl volume-up
bindel = ,XF86AudioLowerVolume, exec, $mediactl volume-down
bindel = ,XF86AudioMute, exec, $mediactl mute
bindel = ,XF86AudioMicMute, exec, $mediactl mic-mute
bindel = ,XF86MonBrightnessUp, exec, $mediactl brightness-up
bindel = ,XF86MonBrightnessDown, exec, $mediactl brightness-down

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# =============================================================
# Submap keybinding >>>
# =============================================================

# Launch applications/links
bind = $mainMod, SPACE, submap, launch
submap = launch
bind = , T, exec, bash -c '$browser --new-tab https://chatgpt.com/?temporary-chat=true & disown; hyprctl dispatch submap reset'
bind = , C, exec, bash -c '$browser --new-tab https://chatgpt.com/ & disown; hyprctl dispatch submap reset'
bind = , G, exec, bash -c '$browser --new-tab https://gemini.google.com/app & disown; hyprctl dispatch submap reset'
bind = , P, exec, bash -c '$browser --new-tab https://www.perplexity.ai/ & disown; hyprctl dispatch submap reset'
bind = , O, exec, bash -c '$browser --new-tab https://www.theodinproject.com/dashboard & disown; hyprctl dispatch submap reset'
bind = , D, exec, bash -c '$browser --new-tab https://chat.deepseek.com/ & disown; hyprctl dispatch submap reset'
bind = , Q, exec, bash -c '$browser --new-tab https://chat.qwen.ai/ & disown; hyprctl dispatch submap reset'
bind = , K, exec, bash -c '$browser --new-tab https://www.kimi.com/ & disown; hyprctl dispatch submap reset'
bind = , N, exec, bash -c '$browser --new-tab https://notebooklm.google.com/ & disown; hyprctl dispatch submap reset'
bind = , F, exec, bash -c '$browser --new-tab https://www.facebook.com/ & disown; hyprctl dispatch submap reset'
bind = , A, exec, bash -c '$browser --new-tab https://annas-archive.org/ & disown; hyprctl dispatch submap reset'

bind = $mainMod, C, exec, bash -c '$browser --app=https://chatgpt.com/?temporary-chat=true & disown; hyprctl dispatch submap reset'
bind = $mainMod, P, exec, bash -c '$browser --app=https://www.perplexity.ai/ & disown; hyprctl dispatch submap reset'
bind = $mainMod, G, exec, bash -c '$browser --app=https://gemini.google.com/app & disown; hyprctl dispatch submap reset'
bind = $mainMod, D, exec, bash -c '$browser --app=https://chat.deepseek.com/ & disown; hyprctl dispatch submap reset'
bind = $mainMod, F, exec, bash -c '$browser --app=https://www.facebook.com/ & disown; hyprctl dispatch submap reset'
bind = $mainMod, N, exec, bash -c '$browser --app=https://notebooklm.google.com/ & disown; hyprctl dispatch submap reset'
bind = $mainMod, Y, exec, bash -c '$browser --app=https://www.youtube.com/ & disown; hyprctl dispatch submap reset'
bind = $mainMod, M, exec, bash -c '$browser --app=https://hurawatchtv.tv/home & disown; hyprctl dispatch submap reset'
bind = $mainMod, R, exec, bash -c '$browser --app=https://doc.rust-lang.org/book & disown; hyprctl dispatch submap reset'
bind = $mainMod, Q, exec, bash -c '$browser --app=https://chat.qwen.ai/?temporary-chat=true & disown; hyprctl dispatch submap reset'
bind = $mainMod, O, exec, bash -c '$browser --app=https://www.theodinproject.com/dashboard & disown; hyprctl dispatch submap reset'
bind = $mainMod SHIFT, D, exec, bash -c '$browser --app=https://developer.mozilla.org/en-US/ & disown; hyprctl dispatch submap reset'
bind = $mainMod SHIFT, S, exec, bash -c '$browser --app=https://open.spotify.com/ & disown; hyprctl dispatch submap reset'


bind = $mainMod, S, exec, bash -c '$browserForSchool --app=https://classroom.google.com & disown; hyprctl dispatch submap reset'

bind = $mainMod, K, exec, bash -c '$passmanager & disown; hyprctl dispatch submap reset'
bind = $mainMod, V, exec, bash -c '$ide & disown; hyprctl dispatch submap reset'

bind = , ESCAPE, submap, reset
submap = reset

# Resize windows
bind = $mainMod, R, submap, resize
submap = resize
bind = , right, resizeactive, 20 0
bind = , left, resizeactive, -20 0
bind = , up, resizeactive, 0 -20
bind = , down, resizeactive, 0 20
bind = , ESCAPE, submap, reset
submap = reset

# =============================================================
# Keyboard mouse support V2 (Toggle + Arrow Keys)
# =============================================================
bind = $mainMod, Q, submap, mouse-mode

# Outsite so I can still use it without the toggle
bind = , KP_Insert, exec, $mouseclick left
bind = , KP_Enter, exec, $mouseclick right
bind = , KP_Delete, exec, $mouseclick middle
submap = mouse-mode

# Normal speed
binde = , left, exec, ydotool mousemove -- -30 0
binde = , down, exec, ydotool mousemove -- 0 30
binde = , right, exec, ydotool mousemove -- 30 0
binde = , up, exec, ydotool mousemove -- 0 -30

# Slower speed with Shift (for precision)
binde = Shift, left, exec, ydotool mousemove -- -10 0
binde = Shift, down, exec, ydotool mousemove -- 0 10
binde = Shift, right, exec, ydotool mousemove -- 10 0
binde = Shift, up, exec, ydotool mousemove -- 0 -10

bind = , KP_Insert, exec, $mouseclick left
bind = , KP_Enter, exec, $mouseclick right
bind = , KP_Delete, exec, $mouseclick middle
bind = , KP_End, exec, $mouseclick toggle

bind = , escape, submap, reset
submap = reset

