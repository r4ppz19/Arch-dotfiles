# =================================================
# Launch AI web applications
# =================================================
bind = $mainMod, A, submap, AI Slop
submap = AI Slop, reset

# Clean UI with --app option:
bind = $mainMod, V, exec, $browser --app=https://copilot.microsoft.com/
bind = $mainMod, K, exec, $browser --app=https://www.kimi.com/
bind = $mainMod, X, exec, $browser --app=https://github.com/copilot
bind = $mainMod, C, exec, $browser --app=https://chatgpt.com/?temporary-chat=true
bind = $mainMod, P, exec, $browser --app=https://www.perplexity.ai/
bind = $mainMod, G, exec, $browser --app=https://gemini.google.com/app
bind = $mainMod, D, exec, $browser --app=https://chat.deepseek.com/
bind = $mainMod, N, exec, $browser --app=https://notebooklm.google.com/
bind = $mainMod, Q, exec, $browser --app=https://chat.qwen.ai/?temporary-chat=true; hyprctl dispatch submap reset
bind = $mainMod, H, exec, $browser --app=https://huggingface.co/chat/
bind = $mainMod, A, exec, $browser --app=https://claude.ai/

# Normal website UI
bind = , C, exec, $browser --new-tab https://chatgpt.com/?temporary-chat=true
bind = , G, exec, $browser --new-tab https://gemini.google.com/app
bind = , P, exec, $browser --new-tab https://www.perplexity.ai/
bind = , D, exec, $browser --new-tab https://chat.deepseek.com/
bind = , Q, exec, $browser --new-tab https://chat.qwen.ai/?temporary-chat=true
bind = , K, exec, $browser --new-tab https://www.kimi.com/
bind = , N, exec, $browser --new-tab https://notebooklm.google.com/
bind = , X, exec, $browser --new-tab https://github.com/copilot
bind = , V, exec, $browser --new-tab https://copilot.microsoft.com/
bind = , H, exec, $browser --new-tab https://huggingface.co/chat/
bind = , A, exec, $browser --new-tab https://claude.ai/

bind = , catchall, submap, reset
submap = reset

# =================================================
# Launch applications/links
# =================================================
bind = $mainMod, SPACE, submap, Applications
submap = Applications, reset

bind = , A, exec, $browser --new-tab https://annas-archive.li/
bind = , W, exec, $browser --new-tab https://www.w3schools.com/
bind = , Y, exec, $browser --new-tab https://www.youtube.com/
bind = , F, exec, $browser --new-tab https://www.facebook.com/messages
bind = , G, exec, $browser --new-tab https://github.com/r4ppz
bind = , D, exec, $browser --new-tab https://drive.google.com/drive/my-drive
bind = , M, exec, $browser --new-tab https://mail.google.com/
bind = , E, exec, $browser --new-tab https://getemoji.com/
bind = , N, exec, $browser --new-tab https://news.ycombinator.com/
bind = , T, exec, $browser --new-tab https://monkeytype.com/

bind = , V, exec, $ide
bind = , P, exec, $passmanager

bind = $mainMod, N, exec, $browser --app=https://news.ycombinator.com/
bind = $mainMod, D, exec, $browser --app=https://devdocs.io/
bind = $mainMod, G, exec, $browser --app=https://github.com/r4ppz
bind = $mainMod, F, exec, $browser --app=https://www.facebook.com/messages
bind = $mainMod, Y, exec, $browser --app=https://www.youtube.com/
bind = $mainMod, M, exec, $browser --app=https://music.youtube.com/
bind = $mainMod SHIFT, S, exec, $browser --app=https://open.spotify.com/
bind = $mainMod, T, exec, $browser --app=https://monkeytype.com/

bind = $mainMod, S, exec, $browserForSchool --app=https://classroom.google.com
bind = $mainMod SHIFT, M, exec, $browserForSchool --app=https://mail.google.com/

bind = , catchall, submap, reset
submap = reset

# =================================================
# Utils
# =================================================
bind = $mainMod, U, submap, util
submap = util, reset

bind = SHIFT, S, exec, bash -c $screenshotfull
bind = , S, exec, bash -c $screenshot
bind = , R, exec, bash -c $record
bind = , O, exec, bash -c $ocr
bind = , C, exec, bash -c $colorpicker
bind = , E, exec, bash -c $eyetemp

bind = , ESCAPE, submap, reset
submap = reset

# =================================================
# Resize windows
# =================================================
bind = $mainMod, R, submap, resize
submap = resize

binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20

bind = , catchall, submap, reset
submap = reset

# =================================================
# Control
# =================================================
bind = $mainMod, C, submap, control
submap = control

# Laptop multimedia keys for volume, mute, brightness
bindel = ,1, exec, $mediactl mute
bindel = ,2, exec, $mediactl mic-mute
bindel = ,3, exec, $mediactl volume-down
bindel = ,4, exec, $mediactl volume-up
bindel = ,5, exec, $mediactl brightness-down
bindel = ,6, exec, $mediactl brightness-up

bind = , catchall, submap, reset
submap = reset

# =================================================
# Keyboard mouse support V2 (Toggle + Arrow Keys)
# =================================================
bind = $mainMod, Q, submap, mouse-mode
bind = , F9, submap, mouse-mode

# Outsite so I can still use it without the toggle
bind = , KP_Insert, exec, $mouseclick left
bind = , KP_Enter, exec, $mouseclick right
bind = , KP_Delete, exec, $mouseclick middle
submap = mouse-mode

# Normal speed
binde = , left, exec, ydotool mousemove -- -30 0
binde = , down, exec, ydotool mousemove -- 0 30
binde = , right, exec, ydotool mousemove -- 30 0
binde = , up, exec, ydotool mousemove -- 0 -30

# Slower speed with Shift (for precision)
binde = Shift, left, exec, ydotool mousemove -- -10 0
binde = Shift, down, exec, ydotool mousemove -- 0 10
binde = Shift, right, exec, ydotool mousemove -- 10 0
binde = Shift, up, exec, ydotool mousemove -- 0 -10

bind = , KP_Insert, exec, $mouseclick left
bind = , KP_Enter, exec, $mouseclick right
bind = , KP_Delete, exec, $mouseclick middle
bind = , KP_End, exec, $mouseclick toggle

bind = , Q, exec, $mouseclick left
bind = , W, exec, $mouseclick middle
bind = , E, exec, $mouseclick right
bind = , R, exec, $mouseclick toggle

# Prevent from falling through to catchall
bind = , Shift_L, exec, true

bind = , catchall, exec, $mouseclick reset
submap = reset
