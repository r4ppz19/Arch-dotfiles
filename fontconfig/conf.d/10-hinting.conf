<?xml version="1.0"?>
<!-- <!DOCTYPE fontconfig SYSTEM "fonts.dtd"> -->
<!DOCTYPE fontconfig SYSTEM "/usr/share/xml/fontconfig/fonts.dtd">
<fontconfig>

  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>

    <edit name="hintstyle" mode="assign">
      <const>hintfull</const>
    </edit>
  </match>

</fontconfig>
